name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detectar módulos
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          [ -f backend/requirements.txt ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (lint, formatação e testes)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vero
          POSTGRES_PASSWORD: vero
          POSTGRES_DB: vero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vero:vero@localhost:5432/vero_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest pytest-cov
      - name: Lint
        run: ruff check --output-format=github .
      - name: Formatação
        run: ruff format --check .
      - name: Testes e cobertura
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=70 || code=$?
          # código 5 = nenhum teste encontrado; não falha enquanto não houver testes
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 5 ]; then exit "$code"; fi
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Cobertura do backend" >> "$GITHUB_STEP_SUMMARY"
            coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publicar relatório de cobertura
        if: always() && hashFiles('backend/coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend (lint, formatação, testes e build)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache do build do Next.js
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: nextjs-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Testes e cobertura
        run: npm test --if-present
      - name: Publicar relatório de cobertura
        if: always() && hashFiles('frontend/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage
          retention-days: 14
      - name: Build
        run: npm run build

  e2e:
    name: E2E (fluxo principal, acessibilidade e 360px)
    needs: [detect, frontend]
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build e start do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx next start -p 3000 &
          npx --yes wait-on@8.0.3 --timeout 60000 http://localhost:3000/login
      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Rodar E2E (celular 360px e desktop)
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test
      - name: Publicar relatório do E2E
        if: always() && hashFiles('e2e/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: e2e/playwright-report
          retention-days: 14

  docker:
    name: Build das imagens Docker
    needs: [detect, backend, frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        if: hashFiles('backend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        if: hashFiles('frontend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Check único para a regra de proteção da main: fica vermelho se qualquer job falhar.
  ci-ok:
    name: CI ok
    needs: [detect, backend, frontend, e2e, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar resultado dos jobs
        env:
          FALHOU: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FALHOU" = "true" ]; then
            echo "Algum job do CI falhou ou foi cancelado."
            exit 1
          fi
