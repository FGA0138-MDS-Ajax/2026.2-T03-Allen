services:
  # API FastAPI: usa o banco do Supabase (definido no DATABASE_URL do .env)
  # Migrations: docker compose run --rm backend alembic upgrade head
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - valkey

  # Valkey: eventos em tempo real entre a API e o app (D12, RF17)
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
